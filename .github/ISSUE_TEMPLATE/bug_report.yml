name: Bug report
description: Something is broken. Fill in every field so we can reproduce it.
title: '[Bug]: '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: App version or commit SHA (see About / Settings, or `git rev-parse --short HEAD`).
      placeholder: e.g. 0.3.1 or abc1234
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear summary of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a clean state.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Attach logs or screenshots. Never paste secrets, tokens, private keys, or private customer data.
  - type: checkboxes
    id: secrets
    attributes:
      label: Secrets check
      options:
        - label: I have removed all secrets, tokens, private keys, and private customer data from this report.
          required: true
