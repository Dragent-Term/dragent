name: e2ee-proof

on:
  push:
    branches: [main, staging]
    paths:
      - "dragent/crates/dragent_e2ee/**"
      - "mobile/modules/dragent-e2ee/**"
      - "mobile/src/transport/**"
      - "mobile/plugins/e2ee-nse/**"
      - ".github/workflows/e2ee.yml"
  pull_request:
    paths:
      - "dragent/crates/dragent_e2ee/**"
      - "mobile/modules/dragent-e2ee/**"
      - "mobile/src/transport/**"
      - "mobile/plugins/e2ee-nse/**"
      - ".github/workflows/e2ee.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: e2ee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Client-side E2EE suites: the Rust crypto crate (unit + vector tests) and
  # the phone transport E2EE tests. The relay's ciphertext-only proof and
  # fuzzing run with the hosted service, which isn't in this repository. The full
  # desktop app suite is deliberately not here — it needs macOS system libs.
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # Reuse compiled crates between runs (crypto crate + phone test harness).
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            dragent -> target
            mobile/src/transport/__tests__/harness -> ../../../modules/dragent-e2ee/rust/target
      - name: Crypto crate tests (§12.1)
        working-directory: dragent
        run: cargo test -p dragent_e2ee
      - name: Crypto crate vector tests (§12.1)
        working-directory: dragent
        run: cargo test -p dragent_e2ee --features vectors
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1
      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      # The real-crypto harness builds with --offline, so fetch its crates
      # first (a fresh runner has an empty cargo cache).
      - name: Fetch harness crates
        working-directory: mobile
        run: cargo fetch --locked --manifest-path src/transport/__tests__/harness/Cargo.toml
      - name: Phone transport E2EE tests
        working-directory: mobile
        run: npm run test:e2ee
