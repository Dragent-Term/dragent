name: CLA

# Contributor License Agreement gate. Every pull-request committer must sign
# the CLA in CLA.md (repo root) before the PR can merge.
#
# Label semantics (set by the action):
#   - `cla-signed`     — every committer on the PR has signed. Merge gate met.
#   - `cla-not-signed` — at least one committer still has to sign. PR stays
#                        blocked until the label flips to `cla-signed`.
#
# Recheck: after signing (or if the status looks stale), comment `recheck`
# on the PR and the check re-runs. New commits / new committers re-trigger
# the check automatically.
#
# Maintainer setup (one time):
#   1. Create a personal access token with repo scope and store it as the
#      `CLA_PAT` secret (used below as PERSONAL_ACCESS_TOKEN).
#   2. Confirm `path-to-document` below points at the adopted CLA.md.
#   3. In branch protection for `main`, require the `CLAAssistant` status
#      check (see .github/REQUIRED_CHECKS.md).

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  CLAAssistant:
    name: CLAAssistant
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Secret holding a PAT with repo scope for storing signatures.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot]
          custom-prsign-comment: I have read the CLA Document and I hereby sign the CLA
          lock-pullrequest-aftermerge: false
