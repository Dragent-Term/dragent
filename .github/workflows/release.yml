# Desktop app release: push a tag `v<version>` (matching dragent/app/Cargo.toml)
# to build all four artifacts and publish them + the update manifest to
# S3/CloudFront. The app's auto-updater polls stable/latest.json.
#
#   macOS  arm64 + x86_64  → .dmg          (signed + notarized when secrets exist)
#   Windows x64 + arm64    → -setup.exe    (Inno Setup; unsigned for now)
#
# Baked-in config (compile-time env, see api/backend.rs + autoupdate/mod.rs):
#   DRAGENT_BACKEND_URL_DEFAULT         ← repo var RELEASE_BACKEND_URL (fallback: staging)
#   DRAGENT_UPDATE_MANIFEST_URL_DEFAULT ← the CloudFront manifest URL
#
# Optional macOS signing secrets (workflow auto-detects; unsigned/ad-hoc without):
#   MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC → AWS release role
  contents: read

env:
  RELEASES_CDN: https://d8d93sixrrr9g.cloudfront.net
  RELEASES_BUCKET: dragent-releases-269235677023
  CLOUDFRONT_DISTRIBUTION: E1QRLYB4AQW3ZR
  AWS_RELEASE_ROLE: arn:aws:iam::269235677023:role/dragent-release-github-actions
  AWS_REGION: us-east-1
  # Compile-time bakes (option_env!) picked up by cargo builds in the scripts.
  DRAGENT_BACKEND_URL_DEFAULT: ${{ vars.RELEASE_BACKEND_URL || 'https://beta.api.dragent.dev' }}
  # Web frontend origin: browser sign-in page + desktop session polling.
  DRAGENT_WEB_ORIGIN_DEFAULT: ${{ vars.RELEASE_WEB_ORIGIN || 'https://beta.dragent.dev' }}
  DRAGENT_UPDATE_MANIFEST_URL_DEFAULT: https://d8d93sixrrr9g.cloudfront.net/stable/latest.json

jobs:
  # ── Guard: tag must match the crate version (scripts name artifacts by it) ──
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(grep -m1 -E '^version = ' dragent/app/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::Tag v$TAG != app/Cargo.toml version $CRATE — bump the crate version first"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  # ── macOS: arm64 + x86_64 DMGs ──────────────────────────────────────────────
  macos:
    needs: version
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Import signing certificate
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "No signing cert configured — ad-hoc signing (beta friction applies)."
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/release.keychain-db
          KEYCHAIN_PASS=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the .p12"
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build & package (${{ matrix.arch }})
        working-directory: dragent
        run: |
          ./scripts/package-macos.sh --arch ${{ matrix.arch }} \
            --sign '${{ steps.sign.outputs.identity }}'

      - name: Notarize & staple
        if: steps.sign.outputs.identity != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=$(ls dragent/dist/Dragent-*-macos-${{ matrix.arch }}.dmg)
          xcrun notarytool submit "$DMG" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: dragent/dist/Dragent-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # ── Windows: x64 + arm64 installers (arm64 is cross-compiled) ───────────────
  windows:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build & package (${{ matrix.arch }})
        working-directory: dragent
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Build -Arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}
          path: dragent/dist/Dragent-*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  # ── Publish artifacts + manifest to S3/CloudFront ───────────────────────────
  publish:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: AWS role, and signing the attestations
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      # Anyone can check an installer came from this workflow and commit:
      #   gh attestation verify Dragent-….dmg --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/Dragent-*.dmg
            artifacts/Dragent-*-setup.exe

      # What the desktop app is made of, published beside the installers.
      - name: SBOM (SPDX) for the desktop app
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dragent
          format: spdx-json
          output-file: artifacts/Dragent-${{ needs.version.outputs.version }}-sbom.spdx.json
          upload-artifact: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_RELEASE_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          BASE="$RELEASES_CDN/stable/$VERSION"
          cat > artifacts/latest.json <<EOF
          {
            "stable": {
              "version": "$VERSION",
              "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "platforms": {
                "darwin-aarch64":  { "url": "$BASE/Dragent-$VERSION-macos-arm64.dmg" },
                "darwin-x86_64":   { "url": "$BASE/Dragent-$VERSION-macos-x86_64.dmg" },
                "windows-x86_64":  { "url": "$BASE/Dragent-$VERSION-windows-x64-setup.exe" },
                "windows-aarch64": { "url": "$BASE/Dragent-$VERSION-windows-arm64-setup.exe" }
              }
            }
          }
          EOF
          # Every URL in the manifest must be an artifact we actually built.
          for f in Dragent-$VERSION-macos-arm64.dmg Dragent-$VERSION-macos-x86_64.dmg \
                   Dragent-$VERSION-windows-x64-setup.exe Dragent-$VERSION-windows-arm64-setup.exe; do
            [ -f "artifacts/$f" ] || { echo "::error::missing artifact $f"; exit 1; }
          done
          cat artifacts/latest.json

      - name: Upload to S3 & refresh manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Immutable versioned artifacts, long cache.
          aws s3 cp artifacts/ "s3://$RELEASES_BUCKET/stable/$VERSION/" --recursive \
            --exclude latest.json --cache-control "public, max-age=31536000, immutable"

          # Upload static generic links for stable/latest/ downloads
          aws s3 cp "artifacts/Dragent-$VERSION-macos-arm64.dmg" "s3://$RELEASES_BUCKET/stable/latest/Dragent-macos-arm64.dmg" --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp "artifacts/Dragent-$VERSION-macos-x86_64.dmg" "s3://$RELEASES_BUCKET/stable/latest/Dragent-macos-x86_64.dmg" --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp "artifacts/Dragent-$VERSION-windows-x64-setup.exe" "s3://$RELEASES_BUCKET/stable/latest/Dragent-windows-x64-setup.exe" --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp "artifacts/Dragent-$VERSION-windows-arm64-setup.exe" "s3://$RELEASES_BUCKET/stable/latest/Dragent-windows-arm64-setup.exe" --cache-control "no-cache, no-store, must-revalidate"

          # The moving manifest, short cache + explicit invalidation.
          aws s3 cp artifacts/latest.json "s3://$RELEASES_BUCKET/stable/latest.json" \
            --cache-control "public, max-age=300" --content-type application/json
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION" --paths "/stable/latest.json" "/stable/latest/*"
          echo "Published $VERSION → $RELEASES_CDN/stable/latest.json"
