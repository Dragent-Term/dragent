schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph

autobind: []

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
  Float:
    model:
      - github.com/99designs/gqlgen/graphql.Float
  Boolean:
    model:
      - github.com/99designs/gqlgen/graphql.Boolean
  String:
    model:
      - github.com/99designs/gqlgen/graphql.String
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  AgentToolCall:
    model:
      - server/graph/model.AgentToolCall
  AgentStepResult:
    model:
      - server/graph/model.AgentStepResult
  AgentMessageInput:
    model:
      - server/graph/model.AgentMessageInput
  AgentToolInput:
    model:
      - server/graph/model.AgentToolInput
  AgentStepInput:
    model:
      - server/graph/model.AgentStepInput
