// The phone's end-to-end encryption module (docs/design/e2ee.md §3.2, E4).
// jniLibs/<abi>/libdragent_e2ee_ffi.so come from
// `bash scripts/build-e2ee-rust.sh android` (needs the NDK and cargo-ndk).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.dragent'
version = '0.1.0'

android {
  namespace "dev.dragent.e2ee"
  defaultConfig {
    // Keep rules for JNA and the uniffi binding, applied to the app.
    consumerProguardFiles "consumer-rules.pro"
    versionCode 1
    versionName '0.1.0'
  }
}

def jniLibs = file("src/main/jniLibs")
tasks.register("checkE2eeNativeLibrary") {
  doLast {
    if (!new File(jniLibs, "arm64-v8a/libdragent_e2ee_ffi.so").exists()) {
      throw new GradleException("dragent-e2ee: libdragent_e2ee_ffi.so is missing. Run `bash scripts/build-e2ee-rust.sh android` in mobile/ first.")
    }
  }
}
preBuild.dependsOn("checkE2eeNativeLibrary")

dependencies {
  // uniffi's Kotlin binding loads the Rust library through JNA.
  implementation "net.java.dev.jna:jna:5.17.0@aar"
}
