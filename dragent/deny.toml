[graph]
all-features = false

[licenses]
# Every dependency must be under a license the AGPL-3.0-only release can
# carry. Anything else fails the gate until reviewed.
allow = [
  "AGPL-3.0-only",
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "NCSA",
  # GPLv3 code may be combined into an AGPLv3 work (both licenses' section
  # 13); arborium's nginx grammar is GPL-3.0-only.
  "GPL-3.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates come from crates.io, or from git repositories reviewed here.
unknown-registry = "deny"
unknown-git = "deny"
# Reviewed forks the desktop app builds from (Warp's UI stack, Servo's
# Core Foundation bindings). A new git dependency fails until it's added here.
allow-git = [
  "https://github.com/servo/core-foundation-rs",
  "https://github.com/warpdotdev/cosmic-text.git",
  "https://github.com/warpdotdev/dwrote-rs",
  "https://github.com/warpdotdev/font-kit",
  "https://github.com/warpdotdev/mermaid-to-svg.git",
  "https://github.com/warpdotdev/notify",
  "https://github.com/warpdotdev/rust-objc.git",
  "https://github.com/warpdotdev/winit.git",
  "https://github.com/warpdotdev/yaml-rust.git",
]

[advisories]
yanked = "warn"
# Unmaintained notices fail only for crates this workspace depends on
# directly; for indirect ones there's nothing to do until the parent moves.
unmaintained = "workspace"
# Each ignore needs a reason and a way out. Keep in step with the cargo
# audit ignore list in .github/workflows/security.yml.
ignore = [
  # rmcp: a misbehaving MCP server the user added can make the client buffer
  # a large reply. Fixed in rmcp 3.9, a major upgrade still to be done.
  { id = "RUSTSEC-2026-0462", reason = "needs the rmcp 3.x upgrade" },
  # quick-xml 0.37 / 0.39: only reached through Windows toast notifications
  # (our own XML) and wayland-scanner at build time (protocol files from the
  # crate itself). Neither parses outside input. Clears when they update.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml only parses our own XML" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml only parses our own XML" },
  # Direct dependencies marked unmaintained (no known vulnerability). Each
  # needs a replacement; listed so a new notice still fails the check.
  { id = "RUSTSEC-2025-0141", reason = "bincode: replace (e.g. postcard)" },
  { id = "RUSTSEC-2026-0543", reason = "chrono: replace (e.g. jiff)" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz: goes with chrono" },
  { id = "RUSTSEC-2024-0388", reason = "derivative: replace with derive-where" },
  { id = "RUSTSEC-2024-0384", reason = "instant: replace with web-time" },
]
