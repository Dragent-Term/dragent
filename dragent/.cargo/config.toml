[env]
# This is used to set the minimum deployment target for mac
# https://cmake.org/cmake/help/latest/envvar/MACOSX_DEPLOYMENT_TARGET.html
# If unset, it uses the system one, but we want to build for older versions
# of mac os by default.
#
# This should be kept in sync with the definition of this variable in
# `script/bundle`.
MACOSX_DEPLOYMENT_TARGET = "10.14"

# Flags applied to every target that doesn't have a more specific `[target.*]`
# section below (Cargo does NOT merge `[build]` with a matching `[target.*]`; the
# most specific match wins, so any common flag must be repeated in each section).
[build]
rustflags = ["-C", "symbol-mangling-version=v0"]

[net]
git-fetch-with-cli = true

# macOS bundling runs `install_name_tool` to rewrite dylib load paths, which needs
# extra padding in the Mach-O header. `-headerpad_max_install_names` is a
# clang/ld64-only flag passed via `-Wl,` — it is rejected by the MSVC linker on
# Windows and by GNU ld on Linux, so it must stay scoped to macOS only.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "symbol-mangling-version=v0", "-C", "link-args=-Wl,-headerpad_max_install_names"]
# Re-sign before running so the embedded Info.plist (mic/speech usage keys)
# is BOUND into the signature - TCC ignores it otherwise and SIGABRTs the
# process on the first speech-recognition call. See scripts/cargo-runner-macos.sh.
runner = "scripts/cargo-runner-macos.sh"

[target.'cfg(target_family = "wasm")']
# `web_sys_unstable_apis`: warpui uses unstable web-sys APIs (WebGPU, clipboard).
# `getrandom_backend="wasm_js"`: selects the browser RNG for getrandom 0.3+
# instances (0.2 uses its `js` feature instead — see dragent_web_viewer).
rustflags = ["--cfg=web_sys_unstable_apis", "--cfg=getrandom_backend=\"wasm_js\""]
