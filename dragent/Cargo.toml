[workspace]
members = [
  "app",
  "crates/dragent_pty",
  "crates/dragent_terminal",
  "crates/dragent_shell_hooks",
  "crates/dragent_assets",
  "crates/dragent_persistence",
  "crates/dragent_paths",
  "crates/dragent_automations",
  "crates/dragent_resource_lifecycle",
  "crates/dragent_resource_policy",
  "crates/dragent_workspace_model",
  "crates/dragent_document",
  "crates/dragent_editor",
  "crates/dragent_language_services",
  "crates/runtime_metrics",
  "crates/dragent_parser",
  "crates/warpui",
  "crates/warpui_core", "crates/dragent_index",
  "crates/dragent_index_client",
  "crates/dragent_index_protocol",
  "crates/dragent_index_service",
  "crates/dragent_host",
  "crates/dragent_agent",
  "crates/dragent_session_protocol",
  "crates/dragent_acp",
  "crates/dragent_computer",
  "crates/dragent_terminal_wasm",
  "crates/dragent_web_viewer",
  "crates/dragent_viewer",
  "crates/dragent_workspace_setup",
  "crates/dragent_plugins",
  "crates/dragent_tasks",
  "crates/dragent_e2ee",
]
resolver = "2"

default-members = [
  "app",
  "crates/warpui",
  "crates/dragent_pty",
  "crates/dragent_terminal",
  "crates/dragent_terminal_wasm",
  "crates/dragent_shell_hooks",
  "crates/dragent_parser",
]

[workspace.package]
authors = ["Dragent Contributors"]
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# Local workspace crates. This lets us reference them in other crates without specifying a path.
dragent = { path = "app" }
dragent_pty = { path = "crates/dragent_pty" }
dragent_terminal = { path = "crates/dragent_terminal" }
dragent_shell_hooks = { path = "crates/dragent_shell_hooks" }
dragent_assets = { path = "crates/dragent_assets" }
dragent_viewer = { path = "crates/dragent_viewer" }
dragent_persistence = { path = "crates/dragent_persistence" }
dragent_paths = { path = "crates/dragent_paths" }
dragent_automations = { path = "crates/dragent_automations" }
dragent_resource_lifecycle = { path = "crates/dragent_resource_lifecycle" }
