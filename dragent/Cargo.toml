dragent_workspace_model = { path = "crates/dragent_workspace_model" }
dragent_document = { path = "crates/dragent_document" }
dragent_editor = { path = "crates/dragent_editor" }
dragent_language_services = { path = "crates/dragent_language_services" }
runtime_metrics = { path = "crates/runtime_metrics" }
