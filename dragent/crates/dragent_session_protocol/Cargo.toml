[package]
name = "dragent_session_protocol"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Wire message types for Dragent remote/shared terminal sessions (host/viewer, JSON)"
publish = false

# Original, clean-room message schema for Dragent's shared-session feature.
# No code is copied from Warp's AGPL `session-sharing-protocol` crate (which is
# deliberately NOT a dependency); only the general host/viewer + ordered-event
# shape informed this design. All types here are Dragent's own.

[dependencies]
dragent_workspace_model = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
schemars = { version = "1", features = ["uuid1"] }

[dev-dependencies]
jsonschema = "0.37"
