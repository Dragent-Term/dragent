[package]
name = "dragent_workspace_model"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Bounded, serializable domain types for Dragent's local-first engineering workspace"

[dependencies]
serde = { workspace = true, features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
schemars = { version = "1", features = ["uuid1"] }
url.workspace = true

[dev-dependencies]
serde_json = { workspace = true }
