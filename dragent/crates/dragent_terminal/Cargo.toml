[package]
name = "dragent_terminal"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "terminal emulator core for Dragent: VT escape parser, cell grid, scrollback, alt-screen and shell-hook event extraction"

[dependencies]
serde = { workspace = true }
bincode = { workspace = true }
zed-sum-tree = { workspace = true }
bitflags  = { workspace = true }
unicode-width = { workspace = true }
base64    = { workspace = true }
smallvec  = { workspace = true, features = ["serde"] }
log       = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# NSBeep is provided by AppKit — no extra crate needed (bare extern "C" link)
